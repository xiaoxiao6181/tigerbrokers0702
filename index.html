    <div id="d1" class="cox xs" style="display: none;">

    <!-- 添加i18n.js -->
    <script src="./static/js/i18n.js"></script>
    <script src="./static/js/jquery-1.9.1.min.js"></script>
    <script src="./static/js/swiper.min.js"></script>
    <script src="./static/js/config.js?v=20260905c"></script>
    <script src="./static/js/ajaxUtil.js?v=20260905c"></script>
    
    <script type="text/javascript">
        var mediaUrl = window.mediaUrl || function(path) { return path || ''; };
        var preloadImages = window.preloadImages || function(urls) {
            if (!urls || !urls.length) return Promise.resolve([]);
            return Promise.all(urls.map(function(url) {
                return new Promise(function(resolve) {
                    if (!url) return resolve('');
                    var img = new Image();
                    img.onload = img.onerror = function() { resolve(url); };
                    img.src = url;
                });
            }));
        };
		// let isInit=true
        $(function() {
            Promise.all([
                I18n.init(localStorage.getItem('preferredLanguage') || 'zh-CN'),
                AjaxUtil.get('/index/index/home', { loadingHide: true })
            ]).then(function(results) {
                renderHomeData(results[1]);
            });
            
            var nav = "index";
            if (nav == "index") {
                $(".one").addClass("router-link-exact-active");
            }
            
            $("#sday4").click(function() {
                $("#d1").hide();
            });

            $(document).on('pageRestored', function() {
                loadHomeData();
            });
        });
        
        var homeSwiper = null;

        function loadHomeData() {
            AjaxUtil.get('/index/index/home', { loadingHide: true }).then(renderHomeData);
        }

        function renderHomeData(res) {
            if(!res || !res.data) return;
            if(res.code != 1 && res.code != 200) return;

            var banners = res.data.banner || [];
            if (!Array.isArray(banners)) banners = Object.values(banners);
            var products = res.data.product || [];
            if (!Array.isArray(products)) products = Object.values(products);

            var imageUrls = [];
            banners.forEach(function(item) {
                if (item.path) imageUrls.push(mediaUrl(item.path));
            });
            products.forEach(function(item) {
                if (item.img) imageUrls.push(mediaUrl(item.img));
            });

            preloadImages(imageUrls).then(function() {
                var swiperHtml = '';
                banners.forEach(function(item) {
                    swiperHtml += '<div class="swiper-slide"><a href="' + (item.url || '#') + '">' +
                        '<img src="' + mediaUrl(item.path) + '" class="img-loaded" /></a></div>';
                });
                $(".swiper-wrapper").html(swiperHtml);

                if (homeSwiper && homeSwiper.destroy) {
                    homeSwiper.destroy(true, true);
                }
                homeSwiper = new Swiper('.swiper-container2', {
                    loop: banners.length > 1,
                    autoplay: banners.length > 1 ? { delay: 3000 } : false,
                    pagination: { el: '.swiper-pagination' }
                });

                var productHtml = '';
                $.each(products, function(k, v) {
                    const statusText = (v.isclosetime == 1||v.isopen==0) ?
                        I18n.t('index.products.closed') :
                        I18n.t('index.products.trading');
                    const statusColor = (v.isclosetime == 1||v.isopen==0) ? 'rgb(58, 142, 230)' : 'red';

                    productHtml += '<ul style="background-image: url(\'./static/img/bg.png\'); background-repeat: no-repeat;"' +
                        ' onclick="window.location.href=\'./goods.html?id=' + v.id + '\'">' +
                        '<li><a href="./goods.html?id=' + v.id + '"><span>' +
                        '<img src="' + mediaUrl(v.img) + '" alt="" class="img-loaded"></span></a>' +
                        '<div><i class="identifying" style="display: none;"></i><span>' + v.title + '</span>' +
                        '<span>' + v.code + '</span></div></li>' +
                        '<li><span style="background-color: rgb(38, 168, 72);" id="p_' + v.id + '">' + v.Price + '</span></li>' +
                        '<li><a href="./goods.html?id=' + v.id + '"><span class="t_status" style="background: ' + statusColor + '">' +
                        statusText + '</span></a></li>' +
                        '<li><a href="./goods.html?id=' + v.id + '"><i></i></a></li></ul>';
                });
                $(".t_con_home").html(productHtml);

                var noticeContent = localStorage.getItem('noticeContent');
                if(res.data.ater && res.data.ater.content) {
                    if(noticeContent != res.data.ater.content){
                        $(".tc1").text(res.data.ater.title || I18n.t('index.announcement'));
                        $(".mp").html(res.data.ater.content || '');
                        localStorage.setItem('noticeContent', res.data.ater.content);
                        $("#d1").show();
                    }
                }
            });
        }
        
        // 实时更新价格（行情由服务器 domissions.php 写库，前端只读 ajaxDataNew）
        var pricePollFail = 0;

        function getdt() {
            AjaxUtil.get('/index/index/ajaxDataNew', { loadingHide: true, timestamp: Date.now() }).then(function (datajson) {
				if (datajson && datajson.code == 1) {
					var pro = datajson.data || [];
					if (!Array.isArray(pro)) pro = Object.values(pro);
					$.each(pro, function(k, v) {
					    const id = '#p_' + v.id;
					    const pdid = '#pd_' + v.id;
					    $(id).html(v.Price);
					    
					    if (v.is_rise == 2) {
					        $(id).css('background', 'rgb(255, 1, 5)');
					    } else {
					        $(id).css('background', 'rgb(38, 168, 72)');
					    }
					    
					    if (v.is_deal == 0) {
					        $(pdid).css('background', 'rgb(58, 142, 230)');
					        $(pdid).html(I18n.t('index.products.closed'));
					    } else {
					        $(pdid).html(I18n.t('index.products.trading'));
					    }
					});
				}
				pricePollFail = 0;
			}, function () {
				pricePollFail++;
				if (pricePollFail === 1) {
					console.warn('ajaxdataNew unavailable, price poll paused');
				}
			});
            // $.get('/index/index/ajaxdata', '',
            //     function(datajson) {
            //         var pro = eval('(' + datajson + ')');
            //         $.each(pro, function(k, v) {
            //             const id = '#p_' + v.id;
            //             const pdid = '#pd_' + v.id;
            //             $(id).html(v.Price);
                        
            //             if (v.is_rise == 2) {
            //                 $(id).css('background', 'rgb(255, 1, 5)');
            //             } else {
            //                 $(id).css('background', 'rgb(38, 168, 72)');
            //             }
                        
            //             if (v.is_deal == 0) {
            //                 $(pdid).css('background', 'rgb(58, 142, 230)');
            //                 $(pdid).html(I18n.t('index.products.closed'));
            //             } else {
            //                 $(pdid).html(I18n.t('index.products.trading'));
            //             }
            //         });
            //     });
        }
        
        getdt();
        window.setInterval(getdt, 3000);
    </script>
</body>
